[build]
  base = "tournament-client"
  command = "npm ci --legacy-peer-deps && npm run build"
  publish = "dist/tournament-client/browser"

[build.environment]
  NPM_FLAGS = "--legacy-peer-deps"

[[redirects]]
  from = "/api/*"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
